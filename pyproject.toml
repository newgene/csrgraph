[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csrgraph"
version = "0.1.0"
description = "Memory-efficient CSR-backed knowledge graph for Biolink/Translator data, with KGX loading, pluggable metadata backends, path-finding, and a TRAPI server."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Chunlei Wu", email = "cwu@scripps.edu" }]
keywords = ["knowledge-graph", "biolink", "translator", "trapi", "kgx", "csr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "scipy",
    # The stdlib `compression.zstd` is used on Python >= 3.14; older versions
    # need the third-party package for save/load and .tar.zst archives.
    "zstandard; python_version < '3.14'",
]

[project.optional-dependencies]
# Version floors and major caps, so a fresh install cannot silently cross a
# major boundary:
#   elasticsearch — the client enforces major-version compatibility with the
#     server, so an unpinned install picking up a new major will refuse to talk
#     to an existing cluster. Keep this range aligned with the server you run.
#   lmdb — threading behaviour is version-sensitive: py-lmdb has not declared
#     free-threading support (jnwatson/py-lmdb#458), so on a free-threaded
#     interpreter importing it re-enables the GIL. Pin so that behaviour does not
#     change under you between installs.
#   mcp — 2.x renamed FastMCP to MCPServer and changed other APIs, so mcp_server.py
#     will not import on 1.x. Capped below 3 for the same reason.
lmdb = ["lmdb>=1.4,<3"]
es = ["elasticsearch>=8,<10"]
duckdb = ["duckdb>=0.10"]
server = ["fastapi>=0.100", "uvicorn>=0.20"]
mcp = ["mcp>=2,<3"]
psutil = ["psutil>=5.9"]
all = [
    "lmdb>=1.4,<3",
    "mcp>=2,<3",
    "elasticsearch>=8,<10",
    "duckdb>=0.10",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "psutil>=5.9",
]
dev = ["pytest>=7", "lmdb>=1.4,<3", "fastapi>=0.100", "httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/newgene/csrgraph"
Repository = "https://github.com/newgene/csrgraph"

[tool.setuptools]
py-modules = ["csrgraph_kgx", "metadata_db", "trapi", "trapi_server", "mcp_server", "kg_pattern", "bench_backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
